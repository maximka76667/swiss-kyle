name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # cargo test compiles the whole workspace, including src-tauri, which
      # needs these to link on Linux at all (same deps release.yml installs
      # to build the packaged app) — no test here actually spawns a GUI.
      # Windows needs nothing extra: WebView2 ships on the runner image.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # tauri-build's build.rs validates tauri.conf.json's bundle.resources
      # globs (binaries/swiss-kyle-worker-*, etc.) on ANY compile of
      # src-tauri — including plain `cargo test` — not just packaging. With
      # nothing in src-tauri/binaries/ yet, the glob matches zero files and
      # the build fails before a single test runs. This is self-sufficient:
      # rebuilds the worker sidecar and downloads the other pinned tool
      # binaries it doesn't already have, for the host triple.
      - name: Prepare sidecar binaries
        run: bun scripts/prepare-sidecars.ts

      - name: Run Rust unit tests
        run: bun run test:unit

  frontend:
    # Pure TS/React, no native deps — nothing here is platform-sensitive,
    # so this runs once rather than in the OS matrix below.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Typecheck + build
        run: bun run build

      - name: Lint
        run: bun run lint

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # webkit2gtk-driver provides WebKitWebDriver, which tauri-driver drives
      # on Linux; xvfb backs the virtual display wdio's @wdio/xvfb starts
      # automatically when no real DISPLAY is available (confirmed working
      # on Linux per wiki/components/e2e-tests.md — 30 consecutive full-suite
      # runs, 0 failures, once three real Linux-only bugs were fixed there).
      # Windows needs nothing extra here either: WebView2 ships on the image.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-tauri-driver

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver

      # tauri-driver on Windows shells out to msedgedriver.exe, which must be
      # on PATH and version-matched to the runner's installed WebView2
      # Runtime (not the standalone Edge browser app — they drift out of
      # sync). windows-latest images preinstall a driver matched to the Edge
      # app, which is the wrong one; msedgedriver-tool instead reads the
      # actual WebView2 Runtime version from the registry and downloads the
      # matching driver into the current directory.
      #
      # pwsh does not fail a step on a native command's nonzero exit code by
      # default, so every step here explicitly checks $LASTEXITCODE — without
      # that, a broken `cargo install` or driver download here would silently
      # no-op and every subsequent step would keep running against whatever
      # (likely mismatched) driver was already on PATH, exactly reproducing
      # this bug with no visible failure pointing at the cause.
      - name: Install msedgedriver
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          if ($LASTEXITCODE -ne 0) { throw "cargo install msedgedriver-tool failed (exit $LASTEXITCODE)" }
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if ($LASTEXITCODE -ne 0) { throw "msedgedriver-tool failed to download a matching driver (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$PWD/msedgedriver.exe")) { throw "msedgedriver-tool reported success but msedgedriver.exe is missing from $PWD" }
          & "$PWD/msedgedriver.exe" --version
          $PWD.Path >> $env:GITHUB_PATH

      - name: Install e2e dependencies
        working-directory: e2e
        run: bun install

      - name: Install ui dependencies
        working-directory: ui
        run: bun install

      # A session-creation timeout in the suite itself carries no version
      # info — just "it hung for 2 minutes then gave up" — so a driver/runtime
      # mismatch takes a full ~12-minute run to even see, let alone diagnose.
      # Print everything tauri-driver is actually about to pick up right
      # before starting it, so that info exists in the log regardless of
      # whether the run after this one passes, times out, or fails outright.
      - name: Print driver/runtime versions (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "tauri-driver: $(command -v tauri-driver)"
          tauri-driver --version || true
          echo "WebKitWebDriver: $(dpkg -L webkit2gtk-driver | grep -m1 bin/)"
          dpkg -s webkit2gtk-driver libwebkit2gtk-4.1-0 xvfb 2>&1 | grep -E '^(Package|Version):'
          echo "xvfb-run: $(command -v xvfb-run)"
          echo "DISPLAY=$DISPLAY"

      - name: Print driver/runtime versions (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "tauri-driver: $((Get-Command tauri-driver).Source)"
          tauri-driver --version
          Write-Host "--- msedgedriver.exe on PATH, in resolution order (first wins) ---"
          Get-Command msedgedriver -All | ForEach-Object {
            Write-Host $_.Source
            & $_.Source --version
          }
          try {
            $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
            Write-Host "WebView2 Runtime (machine, per registry): $((Get-ItemProperty $key).pv)"
          } catch {
            Write-Host "WebView2 Runtime registry lookup failed: $_"
          }

      # Self-sufficient: rebuilds the worker sidecar, downloads the other
      # pinned tool binaries (ffmpeg/pandoc/typst/pdfcpu/nats-server) it
      # doesn't already have, builds the debug app, then runs the suite.
      #
      # Linux must go through xvfb-run wrapping this whole step, not rely on
      # wdio's own automatic per-worker Xvfb handling (@wdio/xvfb): tauri-driver
      # (and the app process it launches) is spawned once in wdio.conf.ts's
      # onPrepare hook, which runs in the launcher process itself — outside
      # the per-worker processes @wdio/xvfb wraps. Without a display already
      # present when tauri-driver starts, WebKitGTK fails to initialize and
      # every session request to it hangs until timeout.
      - name: Run e2e suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Run e2e suite (Windows)
        if: runner.os == 'Windows'
        run: bun run test:e2e

      # A session-creation timeout means the app process itself is the only
      # thing that knows what happened, and nothing we control gets to see
      # its output: msedgedriver.exe (spawned by tauri-driver, which sets
      # stdout(Stdio::null()) on it — see tauri-driver's webdriver.rs) is what
      # actually launches app.exe, not tauri-driver or wdio.conf.ts directly,
      # so neither of those ever sees the app's own stdout regardless of how
      # tauri-driver itself is spawned. The debug build's tauri_plugin_log
      # writes to a file in the OS log dir independently of all that, though,
      # so read directly from there instead — the one channel not filtered
      # through msedgedriver's own child-process plumbing. `always()` so this
      # runs on a timeout/failure, not just a pass.
      - name: Print app log file (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          log_dir="$HOME/.local/share/com.swiss.kyle/logs"
          if [ -d "$log_dir" ]; then
            find "$log_dir" -type f -print -exec cat {} \;
          else
            echo "no app log directory at $log_dir"
          fi

      - name: Print app log file (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          $logDir = "$env:LOCALAPPDATA\com.swiss.kyle\logs"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Recurse -File | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName
            }
          } else {
            Write-Host "no app log directory at $logDir"
          }
